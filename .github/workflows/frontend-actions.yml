name: Deploy static content to Pages

# Builds and publishes apps/web-v3 to GitHub Pages (workahomies.com).
# Pages settings are unchanged: source "GitHub Actions", custom domain from apps/web-v3/public/CNAME.
env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
  VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
  VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
  # Optional overrides (repository variables); the app falls back to sensible defaults when unset:
  # GitHub APK release link and the free OpenFreeMap style.
  VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
  VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}

on:
  push:
    branches: ['main']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test --workspace=web-v3
      - name: Build
        # tsc + vite build; also writes dist/404.html so deep links work on Pages
        run: npm run build --workspace=web-v3
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web-v3/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
